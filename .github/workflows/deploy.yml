name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/llm-backend

            git pull origin main

            cat > .env.novo << 'ENVEOF'
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            OLLAMA_HOST=${{ secrets.OLLAMA_HOST }}
            OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}
            OLLAMA_EMBEDDING_MODEL=${{ secrets.OLLAMA_EMBEDDING_MODEL }}
            OLLAMA_VISION_MODEL=${{ secrets.OLLAMA_VISION_MODEL }}
            OLLAMA_OPENAI_BASE_URL=${{ secrets.OLLAMA_OPENAI_BASE_URL }}
            OLLAMA_ALLOWED_MODELS=${{ secrets.OLLAMA_ALLOWED_MODELS }}
            GROK_BASE_URL=${{ secrets.GROK_BASE_URL }}
            GROK_API_KEY=${{ secrets.GROK_API_KEY }}
            GROK_MODEL=${{ secrets.GROK_MODEL }}
            GROK_ALLOWED_MODELS=${{ secrets.GROK_ALLOWED_MODELS }}
            QUEUE_CONCURRENCY=${{ vars.QUEUE_CONCURRENCY }}
            QUEUE_JOB_TIMEOUT_MS=${{ secrets.QUEUE_JOB_TIMEOUT_MS }}
            REDIS_DB=${{ vars.REDIS_DB }}
            INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}
            NORMAN_INTERNAL_URL=${{ secrets.NORMAN_INTERNAL_URL }}
            ENVEOF

            # O .env acima é reescrito inteiro a cada deploy. Toda chave que o
            # serviço precisa tem que estar nele: o que faltar aqui é apagado do
            # servidor sem aviso. Foi assim que INTERNAL_API_TOKEN e
            # NORMAN_INTERNAL_URL sumiram em 03/09 e a ingestão parou. A conexão
            # ollama do gateway lê OLLAMA_OPENAI_BASE_URL, e não OLLAMA_HOST:
            # sem ela o gateway assume 127.0.0.1 enquanto a ingestão fala com o
            # host configurado, e os dois passam a apontar para lugares
            # diferentes sem ninguém perceber.
            # Estas chaves saíram de secret para variável de ambiente. Nenhuma
            # é sigilosa — o número do banco do Redis e quantos jobs a fila
            # processa juntos — e, como secrets de valor curto, elas apagavam do
            # log todo número igual ao delas. Com REDIS_DB="0", um arquivo de
            # 376060 bytes saía como "376***6***" e até um HTTP 200 saía como
            # "***"; o próprio workflow contornava escrevendo por extenso.
            # Diagnóstico nenhum sobrevive a isso.
            #
            # A troca só é segura se o valor for o mesmo, e ninguém consegue ler
            # um secret de fora para conferir. Quem confere é o servidor, com o
            # arquivo que ele já está usando. Divergência não derruba o deploy
            # nem muda o que está em uso: o valor antigo fica, e o erro aparece.
            for chave in REDIS_DB QUEUE_CONCURRENCY; do
              antigo=$(grep "^${chave}=" .env 2>/dev/null | cut -d= -f2-)
              novo=$(grep "^${chave}=" .env.novo | cut -d= -f2-)
              if [ -n "${antigo}" ] && [ "${antigo}" != "${novo}" ]; then
                echo "::error::${chave} mudaria de valor nesta troca; o servidor segue com o que ja usava, e a variavel de ambiente precisa ser corrigida"
                sed -i "s|^${chave}=.*|${chave}=${antigo}|" .env.novo
              elif [ -z "${antigo}" ]; then
                echo "${chave}: o servidor nao tinha valor anterior para comparar"
              else
                echo "${chave}: a variavel de ambiente bate com o que o servidor ja usava"
              fi
            done

            # Valida no arquivo NOVO e só então substitui o que está em uso:
            # secret faltando derruba o deploy sem encostar no .env do servidor.
            for chave in DB_HOST DB_DATABASE REDIS_HOST REDIS_DB QUEUE_CONCURRENCY OLLAMA_HOST GROK_BASE_URL GROK_API_KEY GROK_MODEL GROK_ALLOWED_MODELS INTERNAL_API_TOKEN NORMAN_INTERNAL_URL; do
              grep -qE "^${chave}=.+" .env.novo || { echo "::error::${chave} vazia — configure o secret no ambiente"; rm -f .env.novo; exit 1; }
            done
            mv .env.novo .env
            chmod 600 .env

            mkdir -p logs
            npm ci
            rm -rf dist
            npm run build
            npm run migration:run
            pm2 delete llm-backend || true
            pm2 start ecosystem.config.js --only llm-backend --update-env
            healthy=false
            for attempt in {1..15}; do
              if curl --fail --silent --show-error "http://127.0.0.1:${{ secrets.PORT }}/health" >/dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              pm2 logs llm-backend --lines 100 --nostream
              exit 1
            fi
            pm2 save

            # Estado do executor no log do deploy. Descobrir qual processo está
            # servindo, se a rota de capacidades responde e o que falhou por
            # último custava uma sessão de terminal na máquina, com sudo e o
            # usuário certo. Só código HTTP e linhas de log: nenhum valor de
            # secret é impresso.
            set +e
            echo "::group::Processos e portas"
            pm2 list
            ss -ltn 2>/dev/null | grep -E ':3000|:3001' || echo "sem ss disponivel"
            echo "::endgroup::"
            # Em palavras, e não em código HTTP: há secret com valor "0" neste
            # ambiente, então o GitHub mascara todo zero do log e "200" saía
            # como "***". Palavra não colide com valor de secret.
            echo "::group::As rotas internas respondem?"
            for porta in ${{ secrets.PORT }} 3001; do
              if curl -s --fail -o /dev/null "http://127.0.0.1:${porta}/health"; then
                echo "porta ${porta}: /health responde"
              else
                echo "porta ${porta}: /health NAO responde"
              fi
              if curl -s --fail -o /dev/null \
                -H "x-internal-token: ${{ secrets.INTERNAL_API_TOKEN }}" \
                "http://127.0.0.1:${porta}/internal/generation/capabilities"; then
                echo "porta ${porta}: capacidades do gateway respondem"
              else
                echo "porta ${porta}: capacidades do gateway NAO respondem (build sem gateway ou token recusado)"
              fi
              # A leitura de arte do proofing depende desta rota. Ela aceita o
              # mesmo token e exige a capacidade documents.extract: 404 é build
              # antigo, 403 e a capacidade nao concedida, 400 e a rota viva
              # recusando a imagem de mentira que este teste manda.
              # Imagem de verdade, e nao um payload minusculo: era exatamente
              # isso que faltava. A checagem anterior passava com 400 enquanto a
              # rota recusava toda arte real por tamanho de corpo, e o chamador
              # caia no leitor reserva sem que nada acusasse.
              pedido=$(mktemp)
              node -e '
                const fs = require("fs");
                const img = fs.readFileSync("src/ingestion/extraction/__fixtures__/imagem-arte-colorida.png");
                fs.writeFileSync(process.argv[1], JSON.stringify({
                  contractVersion: 1,
                  correlationId: "deploy-check",
                  image: `data:image/png;base64,${img.toString("base64")}`,
                }));
              ' "${pedido}"
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 \
                -X POST -H 'Content-Type: application/json' \
                -H "x-internal-token: ${{ secrets.INTERNAL_API_TOKEN }}" \
                --data-binary "@${pedido}" \
                "http://127.0.0.1:${porta}/internal/vision/transcribe")
              rm -f "${pedido}"
              case "${codigo}" in
                200|201) echo "porta ${porta}: rota de leitura de arte ACEITOU uma arte de verdade" ;;
                413) echo "porta ${porta}: rota de leitura de arte RECUSOU POR TAMANHO (limite de corpo baixo demais)" ;;
                404) echo "porta ${porta}: rota de leitura de arte AUSENTE (build sem ela)" ;;
                401|403) echo "porta ${porta}: rota de leitura de arte recusou o token ou a capacidade" ;;
                *) echo "porta ${porta}: rota de leitura de arte respondeu algo inesperado" ;;
              esac
            done
            echo "::endgroup::"
            # O modelo de visão existe neste Ollama? Ele é lido de
            # OLLAMA_VISION_MODEL e cai num padrão quando a variável não vem.
            # Modelo ausente ou sem visão faz toda imagem falhar com "nenhum
            # texto extraído", igual para imagem com e sem texto.
            echo "::group::Modelo de visão"
            visao="${{ secrets.OLLAMA_VISION_MODEL }}"
            echo "configurado: ${visao:-<vazio, usando o padrao do codigo>}"
            curl -s "${{ secrets.OLLAMA_HOST }}/api/tags" \
              | tr ',' '\n' | grep -i '"name"' | head -20 || echo "nao consegui listar os modelos"
            echo "::endgroup::"
            # Existir nao e o mesmo que funcionar. Este diagnostico manda os bytes
            # de uma imagem versionada -- sempre a mesma -- para cada modelo e diz
            # em palavras qual deles devolve o codigo escrito nela. Separa as tres
            # causas de "nenhum texto extraido": modelo ausente, modelo que nao
            # recebe a imagem, e modelo que recebe mas prefere a saida de
            # emergencia do prompt a transcrever.
            echo "::group::O modelo de visao consegue ler uma imagem?"
            OLLAMA_HOST="${{ secrets.OLLAMA_HOST }}" \
              node scripts/diagnostico-visao.mjs "${visao}" minicpm-v \
              || echo "o diagnostico de visao nao chegou ao fim"
            echo "::endgroup::"
            # Quanto a leitura de arte demorou, e em que tamanho ela foi. O
            # chamador desiste em 180 segundos e a desistencia chega la como
            # "revisao nao disponivel": sem a duracao registrada aqui, subir ou
            # baixar o teto de reducao vira palpite.
            # Direto no arquivo, e nao por `pm2 logs --lines N`: a leitura que
            # interessa e a que o usuario acabou de pedir, e ela fica para tras
            # da janela assim que o servico registra qualquer outra coisa. O
            # arquivo sobrevive ao restart do deploy, entao o rastro nao se
            # perde -- ao contrario do container do Norman, que e recriado.
            #
            # O caminho vem do proprio pm2, e nao chutado do ecosystem: na
            # primeira versao desta checagem ele foi chutado, o arquivo nao
            # existia, o `2>/dev/null` engoliu o erro e a checagem anunciou
            # "nenhuma leitura registrada" para um servico que tinha acabado de
            # transcrever uma arte. Dizer que os arquivos nao foram achados e
            # diferente de dizer que nada foi lido.
            # A ingestao termina marcando o documento como pronto; o estudo
            # e a etapa seguinte, e e ela que grava a nota. Documento pronto
            # sem nota e o que a tela mostra como "Estudando" — e, quando o
            # estudo falhou de vez, ele ficava assim sem nada que o tirasse de
            # la. Ninguem percebia o acumulo ate alguem reparar na tela dias
            # depois.
            echo "::group::Estudos parados"
            DB_HOST="${{ secrets.DB_HOST }}" DB_PORT="${{ secrets.DB_PORT }}" \
              DB_USERNAME="${{ secrets.DB_USERNAME }}" DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              DB_DATABASE="${{ secrets.DB_DATABASE }}" \
              node scripts/estudos-parados.mjs
            echo "::endgroup::"
            # Onde o tempo das frentes de IA e gasto de verdade. A tela mostra
            # o total; esta medicao separa a parte que e o provedor escrevendo
            # da parte que e o gateway montando o pedido -- consertos
            # diferentes, e ate aqui a escolha entre eles era palpite.
            echo "::group::Tempos das frentes de IA"
            DB_HOST="${{ secrets.DB_HOST }}" DB_PORT="${{ secrets.DB_PORT }}" \
              DB_USERNAME="${{ secrets.DB_USERNAME }}" DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              DB_DATABASE="${{ secrets.DB_DATABASE }}" \
              node scripts/tempos-da-ia.mjs
            echo "::endgroup::"
            echo "::group::Ultimas leituras de arte"
            arquivos=$(pm2 jlist 2>/dev/null | node -e '
              let bruto = "";
              process.stdin.on("data", (p) => { bruto += p; });
              process.stdin.on("end", () => {
                try {
                  const apps = JSON.parse(bruto).filter((a) => a.name === "llm-backend");
                  const caminhos = apps.flatMap((a) => [a.pm2_env.pm_out_log_path, a.pm2_env.pm_err_log_path]);
                  console.log(caminhos.filter(Boolean).join(" "));
                } catch { console.log(""); }
              });
            ')
            if [ -z "${arquivos}" ]; then
              echo "o pm2 nao informou caminho de log para llm-backend"
            else
              # A pasta inteira, e nao so os arquivos da instancia atual: o pm2
              # numera o arquivo por instancia, e cada restart do deploy comeca
              # um novo. O rastro da leitura que interessa fica no da instancia
              # anterior.
              pasta=$(dirname "${arquivos%% *}")
              echo "lendo: ${pasta}/*.log"
              existentes=$(ls -1 "${pasta}"/*.log 2>/dev/null | tr '\n' ' ')
              if [ -n "${existentes}" ]; then echo "arquivos: ${existentes}"; fi
              if [ -z "${existentes}" ]; then
                echo "nenhum arquivo de log existe nos caminhos acima"
              else
                leituras=$(grep -ah "transcricao \[\|transcrição \[\|Visão não devolveu texto\|Visao nao devolveu texto\|imagem reduzida\|pedido montado\|fluxo entregue\|resposta recebida" ${existentes} | tail -35)
                if [ -n "${leituras}" ]; then echo "${leituras}"; else echo "os arquivos existem e nenhuma linha de leitura casou"; fi
              fi
            fi
            echo "::endgroup::"
            echo "::group::Ultimos avisos do executor"
            pm2 logs llm-backend --lines 300 --nostream 2>&1 \
              | grep -aiE "warn|error|falhou|recusou" | tail -30
            echo "::endgroup::"
            exit 0
