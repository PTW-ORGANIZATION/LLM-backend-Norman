name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - check SSH secrets are populated
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "SSH_HOST length: ${#HOST}"
          echo "SSH_USER length: ${#USERNAME}"
          echo "SSH_PORT length: ${#PORT}"
          echo "SSH_PRIVATE_KEY length: ${#KEY}"
          echo "SSH_PRIVATE_KEY line count: $(printf '%s' "$KEY" | wc -l)"
          echo "SSH_PRIVATE_KEY first line: $(printf '%s' "$KEY" | head -n1 | cut -c1-20)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/llm-backend

            git pull origin main

            cat > .env << 'ENVEOF'
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            OLLAMA_HOST=${{ secrets.OLLAMA_HOST }}
            OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}
            QUEUE_CONCURRENCY=${{ secrets.QUEUE_CONCURRENCY }}
            QUEUE_JOB_TIMEOUT_MS=${{ secrets.QUEUE_JOB_TIMEOUT_MS }}
            ENVEOF

            mkdir -p logs
            npm install
            npm run build
            npm run migration:run
            pm2 restart llm-backend || pm2 start ecosystem.config.js --name llm-backend
            pm2 save
